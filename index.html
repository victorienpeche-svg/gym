        <div class="tiny mut">${e.part ? `${esc(e.part)} · ` : ""}${esc(
          movLabel(e)
        )} · ${repsTxt(repsFor(e, S.settings.goal))} reps</div>
        ${infoBtnHtml(e.id, "Démonstration", true)}
      </div>
      ${
        activeEi != null
          ? `<button class="btn sm" data-act="doSwapActive" data-ei="${activeEi}" data-orig="${origId}" data-to="${e.id}">Séance</button>
             <button class="btn sm primary" data-act="doSwapActivePerm" data-ei="${activeEi}" data-orig="${origId}" data-to="${e.id}">Toujours</button>`
          : `<button class="btn sm primary" data-act="doSwapDefault" data-orig="${origId}" data-to="${e.id}">Choisir</button>`
      }
    </div>`
      )
      .join("")}
  </div>`);
      }

      function openAddExModal(defaultM) {
        const m = ui.addM || defaultM || "pecs";
        const list = EX.filter((e) => e.m === m);
        modal(`<div class="row between" style="margin-bottom:8px">
    <h3>Ajouter un exercice</h3>
    <button class="btn sm ghost" data-act="close">✕</button>
  </div>
  <div class="tiny mut" style="margin-bottom:4px;font-weight:600">MUSCLES PRINCIPAUX</div>
  <div class="chips" style="margin-bottom:8px">
    ${MAIN_MUSCLES.map((mu) =>
      chip(mu === m, "filterAddM", { m: mu }, MSHORT[mu])
    ).join("")}
  </div>
  <div class="tiny mut" style="margin-bottom:4px;font-weight:600">FINITION FIN DE SÉANCE (1 EXO · 3–4 SÉRIES)</div>
  <div class="chips" style="margin-bottom:10px">
    ${FINISHER_MUSCLES.map((mu) =>
      chip(mu === m, "filterAddM", { m: mu }, MSHORT[mu])
    ).join("")}
  </div>
  <div>
    ${list
      .map(
        (e) => `<div class="exrow" style="align-items:flex-start">
      <div class="grow">
        <div style="font-weight:600">${esc(e.n)}</div>
        <div class="tiny mut">${e.part ? `${esc(e.part)} · ` : ""}${esc(
          movLabel(e)
        )} · ${repsTxt(repsFor(e, S.settings.goal))} reps</div>
        ${infoBtnHtml(e.id, "Démonstration", true)}
      </div>
      <button class="btn sm primary" data-act="doAddEx" data-id="${
        e.id
      }">+ Ajouter</button>
    </div>`
      )
      .join("")}
  </div>`);
      }

      /* ============ Rendu principal & Événements ============ */
      function render() {
        applyTheme();
        if (!S.onboarded) {
          $("#app").innerHTML = renderOnboarding();
          $("nav").hidden = true;
          return;
        }
        $("nav").hidden = false;
        ["home", "cal", "workout", "progress", "settings"].forEach((t) => {
          const b = $("#n-" + t);
          if (b) b.classList.toggle("on", ui.tab === t);
        });
        $("#app").innerHTML =
          ui.tab === "home"
            ? renderHome()
            : ui.tab === "cal"
            ? renderCal()
            : ui.tab === "workout"
            ? renderWorkout()
            : ui.tab === "progress"
            ? renderProgress()
            : renderSettings();
        tick();
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        const act = el.dataset.act;

        if (act === "bg" && e.target === el) {
          closeModal();
          return;
        }
        if (act === "bgDemo" && e.target === el) {
          closeDemoModal();
          return;
        }
        if (act === "close") {
          closeModal();
          return;
        }
        if (act === "closeDemo") {
          closeDemoModal();
          return;
        }
        if (act === "demoModal") {
          openDemoModal(el.dataset.id, false);
          return;
        }
        if (act === "demoPlay") {
          if (demoAnim) {
            demoAnim.paused = !demoAnim.paused;
            if (!demoAnim.paused)
              demoAnim.t0 = performance.now() - (demoAnim.e / 2) * demoAnim.dur;
            el.textContent = demoAnim.paused ? "▶ Lecture" : "⏸ Pause";
          }
          return;
        }
        if (act === "toggleDemoSlow") {
          openDemoModal(el.dataset.id, el.dataset.slow === "1");
          return;
        }
        if (act === "tab") {
          ui.tab = el.dataset.t;
          render();
          window.scrollTo(0, 0);
          return;
        }

        /* Onboarding */
        if (act === "obDay") {
          const d = Number(el.dataset.d);
          const a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          render();
          return;
        }
        if (act === "obDur") {
          S.settings.duration = Number(el.dataset.m);
          render();
          return;
        }
        if (act === "obPrio") {
          const m = el.dataset.m,
            a = S.settings.priority;
          S.settings.priority = a.includes(m)
            ? a.filter((x) => x !== m)
            : [...a, m];
          render();
          return;
        }
        if (act === "obGoal") {
          S.settings.goal = el.dataset.g;
          render();
          return;
        }
        if (act === "finishOb") {
          S.onboarded = true;
          save();
          render();
          return;
        }

        /* Semaine & Durée */
        if (act === "wN") {
          const wk = el.dataset.wk;
          const strict = S.settings.strictDays !== false;
          const maxAllowed = strict ? S.settings.gymDays.length : 6;
          const cur = S.weekN[wk] ?? S.settings.gymDays.length;
          const next = cur + Number(el.dataset.d);
          if (strict && next > maxAllowed) {
            toast(
              `Maximum ${maxAllowed} séances avec tes jours autorisés (modifie tes jours pour plus).`
            );
            return;
          }
          S.weekN[wk] = Math.max(1, Math.min(maxAllowed, next));
          save();
          render();
          return;
        }
        if (act === "daysModal") {
          openDaysModal();
          return;
        }
        if (act === "setDayModal") {
          const d = Number(el.dataset.d),
            a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          delete S.weekN[wkOf(today())];
          save();
          openDaysModal();
          render();
          return;
        }
        if (act === "wDur") {
          const wk = el.dataset.wk;
          S.weekDur[wk] = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setDayDur") {
          const d = el.dataset.d;
          S.dayDur[d] = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setDayDurModal") {
          const d = el.dataset.d;
          S.dayDur[d] = Number(el.dataset.m);
          save();
          openDayModal(d);
          render();
          return;
        }
        if (act === "setDayFinisher") {
          const d = el.dataset.d;
          S.dayFinisher[d] = el.dataset.f;
          save();
          render();
          return;
        }
        if (act === "setDayFinisherModal") {
          const d = el.dataset.d;
          S.dayFinisher[d] = el.dataset.f;
          save();
          openDayModal(d);
          render();
          return;
        }
        if (act === "wPrio") {
          const wk = el.dataset.wk,
            m = el.dataset.m;
          const cur = S.weekPrio[wk] ?? [...S.settings.priority];
          S.weekPrio[wk] = cur.includes(m)
            ? cur.filter((x) => x !== m)
            : [...cur, m];
          save();
          render();
          return;
        }

        /* Lancement séances */
        if (act === "startSlot") {
          startSlot(
            el.dataset.wk,
            Number(el.dataset.idx),
            el.dataset.d || today()
          );
          return;
        }
        if (act === "startSlotClose") {
          closeModal();
          startSlot(
            el.dataset.wk,
            Number(el.dataset.idx),
            el.dataset.d || today()
          );
          return;
        }
        if (act === "startCustomDay" || act === "startCustomDayClose") {
          const d = el.dataset.d || today(),
            P = planWeek(wkOf(d)),
            pair = P.info[d]?.customPair;
          if (act === "startCustomDayClose") closeModal();
          if (pair)
            startCustomPair(pair[0], pair[1], S.dayDur[d] || P.dur, d, wkOf(d));
          return;
        }

        /* Séance libre 2 muscles */
        if (act === "freeMuscle") {
          const m = el.dataset.m;
          let a = [...ui.free.muscles];
          if (a.includes(m)) a = a.filter((x) => x !== m);
          else {
            if (a.length >= 2) a.shift();
            a.push(m);
          }
          ui.free.muscles = a;
          render();
          return;
        }
        if (act === "freeFinisher") {
          ui.free.finisher = el.dataset.f;
          render();
          return;
        }
        if (act === "freeDur") {
          ui.free.dur = Number(el.dataset.m);
          render();
          return;
        }
        if (act === "startFree") {
          if (ui.free.muscles.length === 2) {
            const [m1, m2] = ui.free.muscles;
            const fm =
              ui.free.finisher === "none"
                ? null
                : ui.free.finisher && ui.free.finisher !== "auto"
                ? ui.free.finisher
                : defaultFinisherFor([m1, m2], weekNumberOf(today()));
            startCustomPair(m1, m2, ui.free.dur, today(), wkOf(today()), fm);
          }
          return;
        }

        /* Séance active */
        if (act === "adaptW") {
          adaptActiveDuration(Number(el.dataset.m));
          return;
        }
        if (act === "togSet") {
          const ei = Number(el.dataset.ei),
            si = Number(el.dataset.si);
          const ex = S.active.exercises[ei],
            st = ex.sets[si];
          st.done = !st.done;
          if (st.done) {
            if (!st.r) st.r = String(ex.reps[0]);
            if (!S.active.retro)
              startTimer(
              ex.rest,
              `${ex.name} — Série ${si + 1}/${ex.sets.length}`
            );
          }
          save();
          render();
          return;
        }
        /* Changer de muscle pendant la séance */
        if (act === "chgMuscleModal") {
          if (!S.active) return;
          const old = el.dataset.m;
          const present = new Set(S.active.exercises.map((x) => x.m));
          const opt = (list) =>
            list
              .filter((m) => m !== old && !present.has(m))
              .map((m) => chip(false, "doChgMuscle", { old, nw: m }, MFR[m]))
              .join("");
          modal(`<div class="row between" style="margin-bottom:8px">
            <h3>Changer ${esc(MFR[old] || old)}</h3>
            <button class="btn sm ghost" data-act="close">✕</button>
          </div>
          <p class="small mut">Les exercices pas encore commencés sont remplacés par ceux du nouveau muscle. Les séries déjà validées sont conservées.</p>
          <div class="tiny mut" style="margin:10px 0 4px;font-weight:600">MUSCLES PRINCIPAUX</div>
          <div class="chips">${opt(MAIN_MUSCLES)}</div>
          <div class="tiny mut" style="margin:10px 0 4px;font-weight:600">FINITION</div>
          <div class="chips">${opt(FINISHER_MUSCLES)}</div>`);
          return;
        }
        if (act === "doChgMuscle") {
          const W = S.active,
            old = el.dataset.old,
            nw = el.dataset.nw;
          if (!W || !PROFILE[nw]) return;
          const mins = W.targetDur || S.settings.duration;
          const mains = (W.muscles || []).map((m) => (m === old ? nw : m));
          const tp = timePlan(
            mins,
            S.settings.goal,
            S.settings.exPerMuscle,
            [mains[0], mains[1]],
            null
          );
          const cnt = exCountFor(nw, mins, S.settings.exPerMuscle);
          const fresh = pickForMuscle(nw, cnt, weekNumberOf(W.date)).map(
            (e, i) => buildEx(e, e.id, tp, i, isFinisherMuscle(nw))
          );
          const out = [];
          let inserted = false;
          W.exercises.forEach((x) => {
            if (x.m === old && !x.sets.some((s) => s.done)) {
              if (!inserted) {
                out.push(...fresh);
                inserted = true;
              }
              return;
            }
            out.push(x);
          });
          if (!inserted) out.push(...fresh);
          W.exercises = out;
          if (W.muscles) W.muscles = mains;
          if (isFinisherMuscle(old) && W.finisher) W.finisher = nw;
          const mainNames = [
            ...new Set(
              out.filter((x) => !isFinisherMuscle(x.m)).map((x) => x.m)
            ),
          ];
          if (mainNames.length)
            W.name = mainNames.map((m) => MFR[m]).join(" & ");
          save();
          closeModal();
          toast(`${MFR[old]} → ${MFR[nw]}`);
          render();
          return;
        }

        /* Saisie après coup / modification d'une séance passée */
        if (act === "retroPair") {
          if (S.active) {
            toast("Termine ou quitte d'abord la séance en cours");
            return;
          }
          const d = el.dataset.d,
            m1 = el.dataset.m1,
            m2 = el.dataset.m2;
          closeModal();
          startCustomPair(m1, m2, S.dayDur[d] || S.settings.duration, d, wkOf(d));
          if (S.active) {
            const P = planWeek(wkOf(d));
            const sl = P.slots.find(
              (s) =>
                !S.logs.some((l) => l.weekKey === P.wk && l.slot === s.idx) &&
                s.muscles.includes(m1) &&
                s.muscles.includes(m2)
            );
            S.active.slot = sl ? sl.idx : null;
            S.active.retro = true;
            save();
            render();
          }
          return;
        }
        if (act === "editLog") {
          if (S.active) {
            toast("Termine ou quitte d'abord la séance en cours");
            return;
          }
          const l = S.logs.find((x) => x.id === el.dataset.id);
          if (!l) return;
          S.active = {
            id: l.id,
            date: l.date,
            weekKey: l.weekKey,
            slot: l.slot ?? null,
            name: l.name,
            muscles: l.muscles || [],
            finisher: null,
            targetDur: S.settings.duration,
            startedAt: Date.now(),
            retro: true,
            editing: true,
            durationMin: l.durationMin || null,
            exercises: l.exercises.map((x) => {
              const meta = EXI[x.id];
              return {
                id: x.id,
                orig: x.orig || x.id,
                name: x.name,
                m: x.m,
                t: meta ? meta.t : "c",
                bw: !!(meta && meta.bw),
                inc: (meta && meta.inc) || 2.5,
                rank: 0,
                isFinisher: isFinisherMuscle(x.m),
                reps: repsFor(meta || { t: "c" }, S.settings.goal),
                rest: 90,
                suggest: null,
                sets: x.sets.map((s) => ({
                  w: String(s.w),
                  r: String(s.r),
                  done: true,
                })),
              };
            }),
          };
          save();
          closeModal();
          ui.tab = "workout";
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (act === "checkAll") {
          if (!S.active) return;
          S.active.exercises.forEach((x) =>
            x.sets.forEach((s) => {
              if (!s.done) {
                s.done = true;
                if (!s.r) s.r = String(x.reps[0]);
              }
            })
          );
          save();
          render();
          return;
        }
        if (act === "swapModal") {
          openSwapModal(el.dataset.id, el.dataset.orig, null);
          return;
        }
        if (act === "swapActiveModal") {
          const ei = Number(el.dataset.ei),
            ex = S.active.exercises[ei];
          openSwapModal(ex.id, ex.orig, ei);
          return;
        }
        if (act === "doSwapDefault") {
          S.swaps[el.dataset.orig] = el.dataset.to;
          save();
          closeModal();
          toast("Exercice remplacé");
          render();
          return;
        }
        if (act === "doSwapActive" || act === "doSwapActivePerm") {
          const ei = Number(el.dataset.ei),
            ne = EXI[el.dataset.to];
          if (S.active && ne) {
            if (act === "doSwapActivePerm" && el.dataset.orig) {
              S.swaps[el.dataset.orig] = el.dataset.to;
            }
            const tp = timePlan(
              S.active.targetDur || S.settings.duration,
              S.settings.goal,
              S.settings.exPerMuscle,
              S.active.muscles
            );
            const rank = S.active.exercises[ei].rank || 0;
            S.active.exercises[ei] = buildEx(ne, el.dataset.orig, tp, rank);
            save();
            closeModal();
            toast(
              act === "doSwapActivePerm"
                ? `Remplacé par ${ne.n} (enregistré par défaut)`
                : `Remplacé par ${ne.n}`
            );
            render();
          }
          return;
        }
        if (act === "remActiveEx") {
          const ei = Number(el.dataset.ei);
          S.active.exercises.splice(ei, 1);
          save();
          render();
          return;
        }
        if (act === "addExModal") {
          ui.addM = el.dataset.m || "pecs";
          openAddExModal(ui.addM);
          return;
        }
        if (act === "filterAddM") {
          ui.addM = el.dataset.m;
          openAddExModal(ui.addM);
          return;
        }
        if (act === "doAddEx") {
          const ne = EXI[el.dataset.id];
          if (S.active && ne) {
            const tp = timePlan(
              S.active.targetDur || S.settings.duration,
              S.settings.goal,
              S.settings.exPerMuscle,
              S.active.muscles
            );
            const rank = S.active.exercises.filter((x) => x.m === ne.m).length;
            const nx = buildEx(ne, ne.id, tp, rank);
            S.active.exercises.push(nx);
            save();
            closeModal();
            toast(
              `${ne.n} ajouté (${nx.sets.length} séries × ${repsTxt(nx.reps)})`
            );
            render();
          }
          return;
        }
        if (act === "finishW") {
          const W = S.active;
          const clean = W.exercises
            .map((x) => ({
              id: x.id,
              orig: x.orig || x.id,
              name: x.name,
              m: x.m,
              sets: x.sets
                .filter((s) => s.done || num(s.r) > 0)
                .map((s) => ({
                  w: num(s.w),
                  r: Math.max(1, Math.round(num(s.r) || x.reps[0])),
                })),
            }))
            .filter((x) => x.sets.length);
          if (!clean.length) {
            toast("Valide au moins une série avant de terminer");
            return;
          }
          const durationMin = W.retro
            ? W.durationMin || null
            : Math.max(1, Math.round((Date.now() - W.startedAt) / 60000));
          const mainsDone = [
            ...new Set(
              clean.filter((x) => !isFinisherMuscle(x.m)).map((x) => x.m)
            ),
          ];
          if (W.editing) S.logs = S.logs.filter((l) => l.id !== W.id);
          S.logs.push({
            id: W.id,
            date: W.date,
            weekKey: W.weekKey,
            slot: W.slot,
            name: mainsDone.length
              ? mainsDone.map((m) => MFR[m]).join(" & ")
              : W.name,
            muscles: mainsDone.length ? mainsDone.slice(0, 2) : W.muscles,
            durationMin,
            exercises: clean,
          });
          S.active = null;
          S.timer = null;
          save();
          ui.tab = "home";
          toast("Séance enregistrée ! Bravo 💪");
          render();
          return;
        }
        if (act === "cancelW") {
          confirmM(
            "Abandonner la séance en cours sans enregistrer ?",
            "doCancelW"
          );
          return;
        }
        if (act === "doCancelW") {
          S.active = null;
          S.timer = null;
          save();
          closeModal();
          render();
          return;
        }

        /* Minuteur */
        if (act === "tAdj") {
          if (S.timer) {
            S.timer.end += Number(el.dataset.d) * 1000;
            if (S.timer.end > Date.now()) S.timer.fired = false;
            save();
            tick();
          }
          return;
        }
        if (act === "tStop") {
          S.timer = null;
          save();
          tick();
          return;
        }

        /* Calendrier & Modale Jour */
        if (act === "calNav") {
          const [y, m] = ui.month.split("-").map(Number);
          const d = new Date(y, m - 1 + Number(el.dataset.d), 1);
          ui.month = ymd(d).slice(0, 7);
          render();
          return;
        }
        if (act === "calNow") {
          ui.month = today().slice(0, 7);
          render();
          return;
        }
        if (act === "dayModal") {
          openDayModal(el.dataset.d);
          return;
        }
        if (act === "pinPair") {
          const d = el.dataset.d;
          S.customPins[d] = [el.dataset.m1, el.dataset.m2];
          delete S.pins[d];
          save();
          openDayModal(d);
          render();
          return;
        }
        if (act === "unpinDay") {
          const d = el.dataset.d;
          delete S.customPins[d];
          delete S.pins[d];
          save();
          toast("Séance désépinglée (planning auto rétabli)");
          openDayModal(d);
          render();
          return;
        }
        if (act === "toggleBlock") {
          const d = el.dataset.d;
          if (S.blocked[d]) delete S.blocked[d];
          else {
            S.blocked[d] = true;
            delete S.pins[d];
            delete S.customPins[d];
          }
          save();
          if (!$("#modal").hidden) openDayModal(d);
          render();
          return;
        }

        /* Progrès */
        if (act === "metric") {
          ui.metric = el.dataset.m;
          render();
          return;
        }
        if (act === "addBw") {
          const v = num($("#bw-in").value);
          if (v > 20 && v < 300) {
            S.body.push({ date: today(), w: v });
            save();
            toast("Poids enregistré");
            render();
          }
          return;
        }
        if (act === "delLog") {
          confirmM(
            "Supprimer définitivement cette séance de l’historique ?",
            "doDelLog",
            { id: el.dataset.id }
          );
          return;
        }
        if (act === "doDelLog") {
          S.logs = S.logs.filter((l) => l.id !== el.dataset.id);
          save();
          closeModal();
          render();
          return;
        }

        /* Réglages */
        if (act === "setTheme") {
          S.settings.theme = el.dataset.th;
          applyTheme();
          save();
          render();
          return;
        }
        if (act === "setDur") {
          S.settings.duration = Number(el.dataset.m);
          save();
          render();
          return;
        }
        if (act === "setExMode") {
          S.settings.exPerMuscle = el.dataset.v;
          save();
          render();
          return;
        }
        if (act === "setDay") {
          const d = Number(el.dataset.d),
            a = S.settings.gymDays;
          S.settings.gymDays = a.includes(d)
            ? a.length > 1
              ? a.filter((x) => x !== d)
              : a
            : [...a, d].sort((x, y) => x - y);
          delete S.weekN[wkOf(today())];
          save();
          render();
          return;
        }
        if (act === "setStrict") {
          S.settings.strictDays = el.dataset.v === "1";
          delete S.weekN[wkOf(today())];
          save();
          render();
          return;
        }
        if (act === "setSplit") {
          S.settings.split = el.dataset.v;
          save();
          render();
          return;
        }
        if (act === "setPrio") {
          const m = el.dataset.m,
            a = S.settings.priority;
          S.settings.priority = a.includes(m)
            ? a.filter((x) => x !== m)
            : [...a, m];
          save();
          render();
          return;
        }
        if (act === "setGoal") {
          S.settings.goal = el.dataset.g;
          save();
          render();
          return;
        }
        if (act === "exportJson") {
          const blob = new Blob([JSON.stringify(S, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `muscu-log-haut-${today()}.json`;
          a.click();
          return;
        }
        if (act === "importModal") {
          modal(`<h3>Importer une sauvegarde</h3><textarea id="imp-txt" placeholder="Colle ici le contenu du fichier JSON..."></textarea>
    <div class="row" style="margin-top:10px"><button class="btn grow" data-act="close">Annuler</button><button class="btn primary grow" data-act="doImport">Importer</button></div>`);
          return;
        }
        if (act === "doImport") {
          try {
            const o = JSON.parse($("#imp-txt").value);
            if (o && o.settings) {
              const f = fresh();
              S = Object.assign(f, o, {
                settings: Object.assign(f.settings, o.settings || {}),
              });
              save();
              closeModal();
              toast("Sauvegarde importée ✓");
              render();
            } else {
              toast("Format JSON invalide");
            }
          } catch (err) {
            toast("Erreur de lecture du JSON");
          }
          return;
        }
        if (act === "resetConfirm") {
          confirmM("Tout effacer (séances, réglages, records) ?", "doReset");
          return;
        }
        if (act === "doReset") {
          S = fresh();
          save();
          closeModal();
          render();
          return;
        }
      });

      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.id === "demo-scrub" && demoAnim) {
          demoAnim.paused = true;
          const v = Number(el.value) / 100;
          demoAnim.e = v;
          demoAnim.draw(v);
          demoAnim.cap(v < 0.5 ? 0 : 1);
          const b = $("#demo-playbtn");
          if (b) b.textContent = "▶ Lecture";
          return;
        }
        if (el.dataset && el.dataset.set && S.active) {
          const ei = Number(el.dataset.ei),
            si = Number(el.dataset.si);
          const ex = S.active.exercises[ei];
          if (ex && ex.sets[si]) {
            ex.sets[si][el.dataset.set] = el.value;
            save();
          }
        }
      });

      document.addEventListener("change", (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.act === "wDate" && S.active && el.value) {
          const nd = el.value;
          if (nd > today()) {
            toast("Impossible de choisir une date future");
            render();
            return;
          }
          const nwk = wkOf(nd);
          if (nwk !== S.active.weekKey) S.active.slot = null;
          S.active.date = nd;
          S.active.weekKey = nwk;
          S.active.retro = S.active.retro || nd < today();
          save();
          render();
          return;
        }
        if (el.dataset && el.dataset.act === "progEx") {
          ui.progEx = el.value;
          render();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!$("#demo-modal").hidden) {
            closeDemoModal();
            return;
          }
          if (!$("#modal").hidden) {
            closeModal();
          }
        }
      });

      render();
    </script>
  </body>
</html>
