<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muscu Log — Haut du corps + Finition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080c14;
        --s1: #0f1623;
        --s2: #162032;
        --s3: #1f2d44;
        --line: #273752;
        --text: #f1f5f9;
        --mut: #94a3b8;
        --acc: #22d3ee;
        --acc-ink: #04131a;
        --acc-soft: rgba(34, 211, 238, 0.14);
        --acc-mid: rgba(34, 211, 238, 0.45);
        --acc-glow: rgba(34, 211, 238, 0.09);
        --ok: #10b981;
        --warn: #f59e0b;
        --bad: #f43f5e;
        --blue: #818cf8;
        --r: 14px;
      }
      [data-theme="coral"] {
        --bg: #0f0b12;
        --s1: #18121e;
        --s2: #231a2c;
        --s3: #30243c;
        --line: #3d2e4d;
        --text: #faf5ff;
        --mut: #b3a4c4;
        --acc: #fb7185;
        --acc-ink: #1f050a;
        --acc-soft: rgba(251, 113, 133, 0.15);
        --acc-mid: rgba(251, 113, 133, 0.45);
        --acc-glow: rgba(251, 113, 133, 0.09);
        --ok: #34d399;
        --warn: #fbbf24;
        --bad: #ef4444;
        --blue: #38bdf8;
      }
      [data-theme="emerald"] {
        --bg: #07110e;
        --s1: #0e1c17;
        --s2: #152821;
        --s3: #1d362d;
        --line: #27473b;
        --text: #ecfdf5;
        --mut: #93b5a7;
        --acc: #34d399;
        --acc-ink: #031a11;
        --acc-soft: rgba(52, 211, 153, 0.15);
        --acc-mid: rgba(52, 211, 153, 0.45);
        --acc-glow: rgba(52, 211, 153, 0.09);
        --ok: #22d3ee;
        --warn: #fbbf24;
        --bad: #fb7185;
        --blue: #a78bfa;
      }
      [data-theme="amber"] {
        --bg: #0e0c0a;
        --s1: #181511;
        --s2: #241f19;
        --s3: #322b22;
        --line: #42382c;
        --text: #faf8f5;
        --mut: #b5aa9c;
        --acc: #fb923c;
        --acc-ink: #1c0b02;
        --acc-soft: rgba(251, 146, 60, 0.15);
        --acc-mid: rgba(251, 146, 60, 0.45);
        --acc-glow: rgba(251, 146, 60, 0.09);
        --ok: #4ade80;
        --warn: #facc15;
        --bad: #f87171;
        --blue: #60a5fa;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      [hidden] {
        display: none !important;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
        padding-bottom: calc(86px + env(safe-area-inset-bottom));
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: "Barlow Condensed", Inter, sans-serif;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin: 0;
        text-transform: uppercase;
      }
      h1 {
        font-size: 30px;
      }
      h2 {
        font-size: 21px;
        margin-bottom: 10px;
      }
      h3 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      p {
        margin: 0 0 8px;
      }
      .mut {
        color: var(--mut);
      }
      .small {
        font-size: 13px;
      }
      .tiny {
        font-size: 12px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px 14px;
      }
      .top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .top .sub {
        color: var(--mut);
        font-size: 13px;
        text-transform: capitalize;
      }
      .card {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 14px;
        margin-bottom: 12px;
      }
      .card.hl {
        border-color: var(--acc-mid);
        background: linear-gradient(180deg, var(--acc-glow), var(--s1) 60%);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrapx {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .gap {
        height: 10px;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--line);
        background: var(--s2);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 11px;
        font-weight: 600;
        min-height: 42px;
      }
      .btn:hover {
        background: var(--s3);
      }
      .btn.primary {
        background: var(--acc);
        color: var(--acc-ink);
        border-color: var(--acc);
      }
      .btn.primary:hover {
        filter: brightness(1.07);
      }
      .btn.danger {
        color: var(--bad);
        border-color: rgba(244, 63, 94, 0.4);
        background: transparent;
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.sm {
        padding: 6px 10px;
        min-height: 34px;
        font-size: 13px;
        border-radius: 9px;
      }
      .btn.block {
        width: 100%;
      }
      .btn:focus-visible,
      .chip:focus-visible,
      .info-btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .cell:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      /* Bouton icône info sous chaque exercice */
      .info-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 6px;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--acc-mid);
        background: var(--acc-soft);
        color: var(--acc);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .info-btn:hover {
        background: var(--acc-mid);
        color: var(--text);
      }
      .info-btn:active {
        transform: scale(0.97);
      }
      .info-btn svg {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .info-btn.compact {
        margin-top: 4px;
        padding: 3px 8px;
        font-size: 11.5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--s2);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }
      .chip.on {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--acc-ink);
      }
      .chip.sq {
        min-width: 44px;
        text-align: center;
        border-radius: 10px;
        padding: 9px 0;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--s3);
        color: var(--mut);
      }
      .tag.acc {
        background: var(--acc-soft);
        color: var(--acc);
      }
      .tag.ok {
        background: rgba(16, 185, 129, 0.16);
        color: var(--ok);
      }
      .tag.bad {
        background: rgba(244, 63, 94, 0.16);
        color: var(--bad);
      }
      .tag.warn {
        background: rgba(245, 158, 11, 0.16);
        color: var(--warn);
      }
      .tag.blue {
        background: rgba(129, 140, 248, 0.16);
        color: var(--blue);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--text);
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        width: 100%;
        min-height: 42px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 12px;
      }
      .tile {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
      }
      .tile b {
        display: block;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 30px;
        line-height: 1.05;
      }
      .tile span {
        font-size: 12px;
        color: var(--mut);
      }
      .timebox {
        background: var(--s2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 10px 0;
      }
      .timebox .tval {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--acc);
        line-height: 1;
      }
      .day {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-top: 1px solid var(--line);
        padding: 10px 2px;
      }
      .day:first-child {
        border-top: 0;
      }
      .day.rest-fixed {
        opacity: 0.55;
      }
      .day .dn {
        width: 46px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 18px;
        text-transform: uppercase;
        color: var(--mut);
      }
      .day.today .dn {
        color: var(--acc);
      }
      .day .st {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 13px;
        background: var(--s3);
        color: var(--mut);
        flex: none;
      }
      .day .st.done {
        background: var(--ok);
        color: #031d14;
      }
      .day .st.plan {
        background: var(--acc-soft);
        color: var(--acc);
        border: 1px solid var(--acc);
      }
      .day .st.blocked {
        background: rgba(244, 63, 94, 0.16);
        color: var(--bad);
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 5px;
      }
      .cal .h {
        text-align: center;
        font-size: 12px;
        color: var(--mut);
        padding: 4px 0;
        font-weight: 600;
      }
      .cell {
        min-height: 64px;
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 5px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 2px;
        color: var(--text);
        min-width: 0;
      }
      .cell .n {
        font-size: 12px;
        font-weight: 600;
        color: var(--mut);
      }
      .cell .l {
        font-size: 11px;
        font-weight: 700;
        line-height: 1.15;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cell.other {
        opacity: 0.35;
      }
      .cell.rest-fixed {
        background: var(--bg);
        opacity: 0.65;
      }
      .cell.today {
        border-color: var(--text);
      }
      .cell.today .n {
        color: var(--text);
      }
      .cell.plan {
        background: var(--acc-soft);
        border-color: var(--acc-mid);
      }
      .cell.plan .l {
        color: var(--acc);
      }
      .cell.done {
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.5);
      }
      .cell.done .l {
        color: var(--ok);
      }
      .cell.blocked {
        background: repeating-linear-gradient(
          45deg,
          rgba(244, 63, 94, 0.12) 0 6px,
          transparent 6px 12px
        );
        border-color: rgba(244, 63, 94, 0.45);
      }
      .cell.blocked .l {
        color: var(--bad);
      }
      .cell.missed .l {
        color: var(--warn);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 12px;
        color: var(--mut);
        margin-top: 10px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 0 8px;
        padding: 6px 10px;
        background: var(--s2);
        border-left: 3px solid var(--acc);
        border-radius: 8px;
      }
      .mhead.fin {
        border-left-color: var(--warn);
        background: linear-gradient(
          90deg,
          rgba(245, 158, 11, 0.12),
          var(--s2) 70%
        );
      }
      .mhead b {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 18px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .ex {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 12px;
        margin-bottom: 10px;
      }
      .ex h3 {
        margin: 0;
      }
      .sets {
        display: grid;
        grid-template-columns: 28px 1fr 1fr 44px;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }
      .sets .hd {
        font-size: 11px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .sets .sn {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 18px;
        color: var(--mut);
        text-align: center;
      }
      .sets input {
        text-align: center;
        font-weight: 600;
        font-size: 16px;
      }
      .sets input.dn {
        background: rgba(16, 185, 129, 0.14);
        border-color: rgba(16, 185, 129, 0.5);
      }
      .ck {
        width: 44px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--s2);
        display: grid;
        place-items: center;
        font-size: 18px;
        color: var(--mut);
      }
      .ck.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #031d14;
      }
      .hint {
        font-size: 12.5px;
        color: var(--mut);
        margin-top: 6px;
      }
      .hint b {
        color: var(--acc);
        font-weight: 600;
      }
      .prev {
        font-size: 12px;
        color: var(--mut);
      }
      .sugg {
        font-size: 13px;
        margin-top: 4px;
        color: var(--acc);
      }
      #timer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(64px + env(safe-area-inset-bottom));
        z-index: 30;
        padding: 0 10px 8px;
        pointer-events: none;
      }
      #timer .in {
        pointer-events: auto;
        max-width: 700px;
        margin: 0 auto;
        background: var(--s3);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 10px 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        gap: 10px;
        position: relative;
        overflow: hidden;
      }
      #timer.fin .in {
        background: var(--acc);
        color: var(--acc-ink);
        border-color: var(--acc);
      }
      #timer .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--acc);
        width: 0;
        transition: width 0.25s linear;
      }
      #timer.fin .bar {
        display: none;
      }
      #timer .t {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 36px;
        line-height: 1;
        min-width: 84px;
      }
      #timer .lb {
        font-size: 12px;
        opacity: 0.8;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #timer .btn {
        padding: 6px 10px;
        min-height: 36px;
      }
      #timer.fin .btn {
        background: rgba(0, 0, 0, 0.14);
        border-color: rgba(0, 0, 0, 0.22);
        color: var(--acc-ink);
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
        background: rgba(8, 12, 20, 0.94);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav .in {
        display: flex;
        max-width: 720px;
        margin: 0 auto;
      }
      nav button {
        flex: 1;
        background: none;
        border: 0;
        padding: 9px 0 8px;
        color: var(--mut);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        font-weight: 600;
        min-height: 64px;
        justify-content: center;
      }
      nav button svg {
        width: 23px;
        height: 23px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      nav button.on {
        color: var(--acc);
      }
      #modal,
      #demo-modal {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(0, 0, 0, 0.68);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      #demo-modal {
        z-index: 75;
      }
      #modal .sheet,
      #demo-modal .sheet {
        background: var(--s1);
        border: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        width: 100%;
        max-width: 720px;
        max-height: 88vh;
        overflow: auto;
        padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      }
      @media (min-width: 700px) {
        #modal,
        #demo-modal {
          align-items: center;
        }
        #modal .sheet,
        #demo-modal .sheet {
          border-radius: 20px;
        }
      }
      /* Démonstration visuelle animée */
      .demo-stage {
        background: radial-gradient(
          circle at 50% 35%,
          var(--s3),
          var(--bg) 85%
        );
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px;
        margin: 10px 0;
        position: relative;
        overflow: hidden;
      }
      .demo-stage svg {
        width: 100%;
        height: 195px;
        display: block;
      }
      .demo-stage {
        --c-leg: #4a5a74;
        --c-torso: #6c7d98;
        --c-arm: #a9b6cb;
        --c-leg: color-mix(in srgb, var(--text) 34%, var(--bg));
        --c-torso: color-mix(in srgb, var(--text) 52%, var(--bg));
        --c-arm: color-mix(in srgb, var(--text) 76%, var(--bg));
      }
      .demo-stage svg {
        height: 225px;
      }
      .phase-live {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
        padding: 0 6px;
      }
      .demo-stage [class^="anim-"] {
        animation-duration: var(--dur, 2.4s) !important;
      }
      .demo-stage.slow {
        --dur: 4.8s;
      }
      .phase-cap {
        position: relative;
        height: 36px;
        margin-top: 2px;
      }
      .phase-cap span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
        padding: 0 6px;
        opacity: 0;
        animation-duration: var(--dur, 2.4s);
        animation-iteration-count: infinite;
        animation-timing-function: step-end;
      }
      .phase-cap .pa {
        animation-name: cap-a;
        color: var(--acc);
      }
      .phase-cap .pb {
        animation-name: cap-b;
        color: var(--warn);
      }
      @keyframes cap-a {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes cap-b {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }
      .cycle-bar {
        height: 3px;
        background: var(--s3);
        border-radius: 2px;
        overflow: hidden;
      }
      .cycle-bar i {
        display: block;
        height: 100%;
        background: var(--acc);
        transform-origin: left;
        animation: cyc var(--dur, 2.4s) linear infinite;
      }
      @keyframes cyc {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      .demo-phase {
        position: absolute;
        top: 8px;
        left: 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;

    <script>
      /* ============ Utilitaires ============ */
      const $ = (s, el = document) => el.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) =>
        `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const parse = (s) => {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      };
      const addDays = (d, n) => {
        const x = new Date(d);
        x.setDate(x.getDate() + n);
        return x;
      };
      const monday = (d) => {
        const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
        return x;
      };
      const today = () => ymd(new Date());
      const wkOf = (s) => ymd(monday(parse(s)));
      const num = (v) => {
        const n = parseFloat(String(v ?? "").replace(",", "."));
        return isFinite(n) ? n : 0;
      };
      const nf = (v) => String(Math.round(v * 100) / 100).replace(".", ",");
      const mmss = (s) => {
        s = Math.max(0, Math.round(s));
        return Math.floor(s / 60) + ":" + pad(s % 60);
      };
      const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
      const fmtDay = (d) =>
        cap(
          parse(d).toLocaleDateString("fr-FR", {
            weekday: "long",
            day: "numeric",
            month: "long",
          })
        );
      const fmtShort = (d) =>
        parse(d).toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "short",
        });
      const DN = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];
      const uid = () =>
        Math.random().toString(36).slice(2, 9) +
        Date.now().toString(36).slice(-4);

      /* Icône info réutilisable sous chaque exercice */
      const INFO_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`;
      const infoBtnHtml = (id, label = "Démonstration", compact = false) =>

      /* ============ Données : Haut du corps complet (6 principaux + 3 finition fin de séance) ============ */

        "pecs",
        "dos",
        "trapezes",
        "epaules",
        "biceps",
        "triceps",

      const FINISHER_MUSCLES = ["abdos", "avantbras", "obliques"];
      const MUSCLES = [...MAIN_MUSCLES, ...FINISHER_MUSCLES];
      const isFinisherMuscle = (m) => FINISHER_MUSCLES.includes(m);

      const MFR = {
        pecs: "Pectoraux",
        dos: "Dos complet",
        trapezes: "Trapèzes",
        epaules: "Épaules",
        biceps: "Biceps",
        triceps: "Triceps",
        avantbras: "Avant-bras",
        abdos: "Abdos",
        obliques: "Obliques",

        trapezes: "Trapèzes",
        epaules: "Épaules",
        biceps: "Biceps",

        abdos: "Abdos",
        obliques: "Obliques",
      };

      const MOV_REPS = {
        free: {
          label: "Polyarticulaire libre",
          short: "Poly libre",
          hyper: [6, 10],
          force: [4, 6],
          endu: [12, 15],

        guided: {

          hyper: [8, 12],
          force: [6, 8],
          endu: [12, 15],
        },

          label: "Isolation / guidé mono",
          short: "Isolation",
          hyper: [10, 15],
          force: [8, 12],
          endu: [15, 20],
        },
      };

      const GROS = {
        size: "gros",
        label: "Gros muscle",
        exRange: "2–3 exos",
        setsLabel: "3–4 séries",
        setsShort: [3, 3],
        setsStandard: [3, 3, 3],
        setsLong: [4, 4, 3],
        weeklyTarget: [12, 20],
      };
      const PETIT = {
        size: "petit",
        label: "Petit muscle",
        exRange: "2 exos",
        setsLabel: "4 séries",
        setsShort: [4, 4],
        setsStandard: [4, 4],
        setsLong: [4, 4],
        weeklyTarget: [8, 16],
      };
      const FINITION = {
        size: "finition",
        label: "Finition (fin de séance)",
        exRange: "1 exo (en +)",
        setsLabel: "3–4 séries",
        setsShort: [3],
        setsStandard: [4],
        setsLong: [4],
        weeklyTarget: [6, 12],
      };
      const PROFILE = {
        pecs: GROS,
        dos: GROS,
        trapezes: PETIT,
        epaules: PETIT,
        biceps: PETIT,
        triceps: PETIT,
        avantbras: FINITION,
        abdos: FINITION,
        obliques: FINITION,
      };

      const movOf = (e) => e.mov || (e.t === "i" ? "iso" : "free");
      const movLabel = (e, short = false) => {
        const m = MOV_REPS[movOf(e)] || MOV_REPS.free;
        return short ? m.short : m.label;

      const exCountFor = (m, mins = 60, exMode = "auto") => {
        const sz = (PROFILE[m] || GROS).size;
        if (sz === "finition") return 1;
        if (exMode === "2") return sz === "petit" ? 1 : 2;
        if (exMode === "3") return sz === "petit" ? 2 : 3;
        if (sz === "gros") return mins <= 40 ? 2 : 3;
        return 2;

      const setsFor = (m, rank = 0, mins = 60) => {
        const p = PROFILE[m] || GROS;
        const shortCutoff = p.size === "finition" ? 45 : 40;
        const arr =
          mins <= shortCutoff
            ? p.setsShort
            : mins >= 75
            ? p.setsLong
            : p.setsStandard;
        return arr[Math.min(rank || 0, arr.length - 1)];

        return (m[goal || "hyper"] || m.hyper).slice();

          eq: (p) => RING(p.hd, 6, 4),
          hl: [["seg", "sh", "el", 0.3, 1, 10]],
          path: ["hd"],
        },
        facepull: {
          segs: SIDE_SEGS,
          bg: `<line x1="238" y1="8" x2="238" y2="168" stroke="var(--s3)" stroke-width="8" stroke-linecap="round"/><circle cx="238" cy="40" r="6" fill="var(--s2)" stroke="var(--line)"/>`,
          A: standArm({ el: [172, 58], hd: [198, 52] }),
          B: standArm({ el: [170, 50], hd: [156, 44] }),
          eq: (p) =>
            `<line x1="238" y1="40" x2="${p.hd[0]}" y2="${p.hd[1]}" stroke="var(--mut)" stroke-width="2"/>${RING(p.hd, 5, 3)}`,
          hl: [["dot", "sh", "hip", 0, 11, 10, -5, -2]],
          path: ["hd"],
        },
      };

      function drawRig(rig, p) {
        const col = {
          leg: "var(--c-leg)",
          torso: "var(--c-torso)",
          arm: "var(--c-arm)",
          neck: "var(--c-torso)",
        };
        let s = "";
        rig.segs.forEach((g) => {
          if (g[0] === "poly") {
            const pts = g[1].map((n) => p[n].join(",")).join(" ");
            s += `<polygon points="${pts}" fill="var(--bg)" stroke="var(--bg)" stroke-width="${
              g[2] + 4
            }" stroke-linejoin="round"/><polygon points="${pts}" fill="${
              col.torso
            }" stroke="${col.torso}" stroke-width="${
              g[2]
            }" stroke-linejoin="round"/>`;
          } else {
            const a = p[g[0]],
              b = p[g[1]];
            if (!a || !b) return;
            s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--bg)" stroke-width="${
              g[2] + 3
            }" stroke-linecap="round"/><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${
              col[g[3]]
            }" stroke-width="${g[2]}" stroke-linecap="round"/>`;
          }
        });
        if (p.head)
          s += `<circle cx="${p.head[0]}" cy="${p.head[1]}" r="10.5" fill="var(--c-arm)" stroke="var(--bg)" stroke-width="2.5"/>`;
        ["hd", "hdL", "hdR"].forEach((k) => {
          if (p[k])
            s += `<circle cx="${p[k][0]}" cy="${p[k][1]}" r="4.6" fill="var(--c-arm)" stroke="var(--bg)" stroke-width="1.5"/>`;
        });
        return s;
      }

      function hlSvg(rig, p, op) {
        return (rig.hl || [])
          .map((h) => {
            if (!p[h[1]] || !p[h[2]]) return "";
            if (h[0] === "seg") {
              const a = lerpPt(p[h[1]], p[h[2]], h[3]),
                b = lerpPt(p[h[1]], p[h[2]], h[4]);
              return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--acc)" stroke-width="${h[5]}" stroke-linecap="round" opacity="${op}"/>`;
            }
            const c = lerpPt(p[h[1]], p[h[2]], h[3]);
            return `<ellipse cx="${c[0] + (h[6] || 0)}" cy="${c[1] + (h[7] || 0)}" rx="${h[4]}" ry="${h[5]}" fill="var(--acc)" opacity="${op}"/>`;
          })
          .join("");
      }

      function demoSvgMarkup(key) {
        const rig = DEMO_RIGS[key] || DEMO_RIGS.curl;
        const paths = (rig.path || [])
          .map((k) => {
            const a = rig.A[k],
              b = rig.B[k];
            if (!a || !b) return "";
            return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".7"/><circle cx="${b[0]}" cy="${b[1]}" r="3" fill="var(--acc)" opacity=".7"/>`;
          })
          .join("");
        return `<svg id="demo-svg" viewBox="0 0 320 190" role="img" aria-label="Démonstration animée du mouvement">
          <line x1="20" y1="169" x2="300" y2="169" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
          <g>${rig.bg || ""}</g>
          <g opacity=".15">${drawRig(rig, rig.B)}</g>
          <g>${paths}</g>
          <g id="dm-body"></g>
        </svg>`;
      }

      let demoAnim = null;
      function stopDemoAnim() {
        if (demoAnim) {
          cancelAnimationFrame(demoAnim.raf);
          demoAnim = null;

      function setDemoCap(meta, ph) {
        const c = $("#demo-cap");
        if (!c) return;
        c.textContent = (ph === 0 ? "▲ " : "▼ ") + meta.ph[ph];
        c.style.color = ph === 0 ? "var(--acc)" : "var(--warn)";
      }
      function initDemoAnim(key, slow, meta) {
        stopDemoAnim();
        const rig = DEMO_RIGS[key] || DEMO_RIGS.curl;
        const body = $("#dm-body");
        if (!body) return;
        const st = {
          raf: 0,
          t0: performance.now(),
          paused: false,
          e: 0,
          phase: -1,
          dur: slow ? 5200 : 2600,
        };
        demoAnim = st;
        st.draw = (e) => {
          const p = lerpPose(rig.A, rig.B, e);
          const op = 0.3 + 0.6 * (rig.hlInv ? 1 - e : e);
          body.innerHTML =
            drawRig(rig, p) + hlSvg(rig, p, op) + (rig.eq ? rig.eq(p, e) : "");
        };
        st.cap = (ph) => setDemoCap(meta, ph);
        const frame = (now) => {
          if (demoAnim !== st || !document.getElementById("dm-body")) return;
          if (!st.paused) {
            const p = ((now - st.t0) % st.dur) / st.dur;
            const tri = p < 0.5 ? p * 2 : 2 - p * 2;
            const e = ease(Math.min(1, Math.max(0, (tri - 0.07) / 0.86)));
            st.e = e;
            const ph = p < 0.5 ? 0 : 1;
            if (ph !== st.phase) {
              st.phase = ph;
              st.cap(ph);
            }
            st.draw(e);
            const sl = $("#demo-scrub");
            if (sl) sl.value = Math.round(e * 100);
            const pr = $("#demo-prog");
            if (pr) pr.style.width = p * 100 + "%";
          }
          st.raf = requestAnimationFrame(frame);
        };
        st.draw(0);
        st.cap(0);
        st.raf = requestAnimationFrame(frame);
      }

          short: "Ép/Trap",
          muscles: ["epaules", "trapezes"],
        },
        pecsDos: {

        },

        },
        pecsEp: {
          key: "pecsEp",
          name: "Pecs & Épaules",
          short: "Pecs/Ép",
          muscles: ["pecs", "epaules"],
        },
        dosEp: {
          key: "dosEp",
          name: "Dos & Épaules",
          short: "Dos/Ép",
          muscles: ["dos", "epaules"],
        },
        epTri: {
          key: "epTri",
          name: "Épaules & Triceps",
          short: "Ép/Tri",
          muscles: ["epaules", "triceps"],
        },
        epBi: {
          key: "epBi",
          name: "Épaules & Biceps",
          short: "Ép/Bi",
          muscles: ["epaules", "biceps"],
        },
        pecsBi: {
          key: "pecsBi",
          name: "Pecs & Biceps",
          short: "Pecs/Bi",
          muscles: ["pecs", "biceps"],
        },
        dosTri: {
          key: "dosTri",
          name: "Dos & Triceps",
          short: "Dos/Tri",
          muscles: ["dos", "triceps"],
        },
      };
      PAIRS.dosTrap = {
        key: "dosTrap",
        name: "Dos & Trapèzes",
        short: "Dos/Trap",
        muscles: ["dos", "trapezes"],
      };
      const PAIR_LIST = Object.values(PAIRS);

      function defaultFinisherFor(mainMuscles = [], seed = 0) {
        const hasPull =
          mainMuscles.includes("dos") || mainMuscles.includes("biceps");
        const order = hasPull
          ? ["abdos", "obliques", "avantbras"]
          : ["abdos", "avantbras", "obliques"];
        return order[Math.abs(seed) % order.length];
      }

      function resolveDayFinisher(d, fallbackFinisher = "abdos") {
        const ov = S.dayFinisher && S.dayFinisher[d];
        if (ov === "none") return null;
        if (ov && FINISHER_MUSCLES.includes(ov)) return ov;
        return fallbackFinisher;
      }

      /* ============ Adaptation au temps & à la taille du muscle ============ */
      const DURATIONS = [35, 40, 45, 50, 60, 75, 90];

      function timePlan(
        mins,
        goal = "hyper",
        exMode = "auto",
        ms = null,
        finM = "abdos"
      ) {
        mins = Math.max(30, Math.min(120, Number(mins) || 60));
        const m1 = ms && ms[0] ? ms[0] : "pecs";
        const m2 = ms && ms[1] ? ms[1] : "biceps";
        const c1 = exCountFor(m1, mins, exMode);
        const c2 = exCountFor(m2, mins, exMode);
        const hasFin = !!(finM && PROFILE[finM]);
        const cFin = hasFin ? 1 : 0;
        const finSets = hasFin ? setsFor(finM, 0, mins) : 0;
        const sumSets = (m, c) => {
          let t = 0;
          for (let i = 0; i < c; i++) t += setsFor(m, i, mins);
          return t;
        };
        const totalSets = sumSets(m1, c1) + sumSets(m2, c2) + finSets;
        const totalEx = c1 + c2 + cFin;
        const avgSets = totalSets / totalEx;
        const perExBudget = mins / totalEx;
        const rawRest = Math.round(
          ((perExBudget - (1.5 + avgSets * 0.65)) * 60) /
            Math.max(1, avgSets - 1)
        );
        const minRest = goal === "force" ? 75 : 50;
        const maxRest = goal === "force" ? 165 : goal === "endu" ? 90 : 135;
        const baseRest = Math.max(
          minRest,
          Math.min(maxRest, Math.round(rawRest / 15) * 15)
        );
        const compRest = Math.min(maxRest, baseRest + 15);
        const isoRest = Math.max(minRest, baseRest - 15);
        const finRest =
          goal === "force"
            ? 75
            : goal === "endu"
            ? 45
            : Math.max(45, Math.min(60, isoRest - 15));
        return {
          mins,
          c1,
          c2,
          cFin,
          finSets,
          totalEx,
          totalSets,
          baseRest,
          compRest,
          isoRest,
          finRest,
        };
      }

      function estimateMinutes(exercises) {
        if (!exercises || !exercises.length) return 0;
        const total = exercises.reduce((acc, ex) => {
          const sets = ex.sets ? ex.sets.length : 3;
          const work = sets * 0.65;
          const rest = Math.max(0, sets - 1) * ((ex.rest || 90) / 60);
          return acc + 1.5 + work + rest;
        }, 0);
        return Math.round(total);
      }

      const buildItems = (items) =>
        items.map((i) => buildEx(i.e, i.orig, i.tp, i.rank, i.isFinisher));

      /* ============ Construction des séances de la semaine ============ */
      function weekNumberOf(wk) {
        if (!wk) return 0;
        return Math.max(0, Math.floor(parse(wk).getTime() / (7 * 86400000)));
      }

      /* Paires cohérentes (clés dans l'ordre canonique de MAIN_MUSCLES) */
      const PREF_PAIRS = {
        auto: [
          "pecs-triceps",
          "dos-biceps",
          "trapezes-epaules",
          "pecs-dos",
          "biceps-triceps",
          "dos-trapezes",
          "pecs-epaules",
        ],
        synergie: [
          "pecs-triceps",
          "dos-biceps",
          "trapezes-epaules",
          "dos-trapezes",
          "epaules-triceps",
          "pecs-epaules",
        ],
        antagoniste: [
          "pecs-dos",
          "biceps-triceps",
          "trapezes-epaules",
          "dos-epaules",
          "pecs-biceps",
          "dos-triceps",
        ],
      };
      /* Muscles qui se sollicitent mutuellement : à ne pas enchaîner sur 2 séances consécutives */
      const SYNERGY = [
        ["pecs", "triceps"],
        ["pecs", "epaules"],
        ["epaules", "triceps"],
        ["dos", "biceps"],
        ["dos", "trapezes"],
        ["trapezes", "epaules"],
        ["trapezes", "biceps"],
      ];
      const synergic = (a, b) =>
        SYNERGY.some(([x, y]) => (x === a && y === b) || (x === b && y === a));

      function splitPairs(n, split, prio, wk = null) {
        const IDX = (m) => MAIN_MUSCLES.indexOf(m);
        const pk = (a, b) => (IDX(a) < IDX(b) ? [a, b] : [b, a]);
        const mainPrio = (prio || []).filter((m) => MAIN_MUSCLES.includes(m));
        const rotN = weekNumberOf(wk) % MAIN_MUSCLES.length;
        const order = MAIN_MUSCLES.slice(rotN).concat(
          MAIN_MUSCLES.slice(0, rotN)
        );
        const total = 2 * n;

        /* 1) Fréquence hebdo par muscle : un prioritaire passe à 2–3 fois, jamais à chaque séance */
        let capBase = Math.max(1, Math.min(2, Math.ceil(n / 2)));
        let capPrio = Math.max(1, Math.min(3, Math.ceil(n / 2)));
        const caps = (m) => (mainPrio.includes(m) ? capPrio : capBase);
        while (order.reduce((s, m) => s + caps(m), 0) < total) {
          capBase++;
          capPrio++;
        }
        const freq = Object.fromEntries(order.map((m) => [m, 0]));
        for (let k = 0; k < total; k++) {
          let best = null,
            bs = -1;
          order.forEach((m) => {
            if (freq[m] >= caps(m)) return;
            const sc = (mainPrio.includes(m) ? 1.5 : 1) / (freq[m] + 1);
            if (sc > bs + 1e-9) {
              bs = sc;
              best = m;
            }
          });
          if (!best) break;
          freq[best]++;
        }

        /* 2) Assemblage en séances cohérentes, sans enchaîner les mêmes muscles */
        const rem = { ...freq };
        const pref = PREF_PAIRS[split] || PREF_PAIRS.auto;
        const union = new Set(Object.values(PREF_PAIRS).flat());
        const out = [];
        let prev = [];
        for (let i = 0; i < n; i++) {
          let best = null,
            bs = -1e9;
          for (let x = 0; x < order.length; x++) {
            for (let y = x + 1; y < order.length; y++) {
              const a = order[x],
                b = order[y];
              if (rem[a] <= 0 || rem[b] <= 0) continue;
              const [p, q] = pk(a, b);
              const key = p + "-" + q;
              let sc = pref.includes(key) ? 10 : union.has(key) ? 3 : -10;
              sc += 2 * (rem[a] + rem[b]);
              [a, b].forEach((m) => {
                if (prev.includes(m)) sc -= 100;
                prev.forEach((pm) => {
                  if (synergic(pm, m)) sc -= 4;
                });
              });
              if (sc > bs) {
                bs = sc;
                best = [p, q];
              }
            }
          }
          if (!best) {
            const left = order.filter((m) => rem[m] > 0);
            const m1 = left[0] || order[0];
            const m2 = order
              .filter((m) => m !== m1)
              .sort((u, v) => freq[u] - freq[v])[0];
            freq[m2]++;
            best = pk(m1, m2);
          }
          best.forEach((m) => (rem[m] = Math.max(0, rem[m] - 1)));
          prev = best;
          out.push(best);
        }
        return out;
      }

      function buildFinisherSequence(n, prio, wSeed = 0) {
        const rot = (a, s) =>
          a.length ? a.slice(s % a.length).concat(a.slice(0, s % a.length)) : a;
        const baseOrder = rot(FINISHER_MUSCLES, wSeed);
        const finPrio = (prio || []).filter((m) =>
          FINISHER_MUSCLES.includes(m)
        );
        /* Un finisseur prioritaire revient au maximum 2 fois / semaine, jamais 2 séances d'affilée */
        const maxPrio = Math.max(1, Math.min(2, Math.ceil(n / 2)));
        const counts = {};
        const out = [];
        for (let i = 0; i < n; i++) {
          const prev = out[i - 1];
          let pick = null;
          if (finPrio.length && i % 2 === 0) {
            pick = finPrio.find(
              (m) => m !== prev && (counts[m] || 0) < maxPrio
            );
          }
          if (!pick) {
            let cand = baseOrder.filter(
              (m) =>
                m !== prev &&
                !(finPrio.includes(m) && (counts[m] || 0) >= maxPrio)
            );
            if (!cand.length) cand = baseOrder.filter((m) => m !== prev);
            pick = cand.sort(
              (a, b) =>
                (counts[a] || 0) - (counts[b] || 0) ||
                baseOrder.indexOf(a) - baseOrder.indexOf(b)
            )[0];
          }
          out.push(pick);
          counts[pick] = (counts[pick] || 0) + 1;
        }
        return out;
      }

      function buildSlots(n, prio, mins, wk = null) {
        const pairs = splitPairs(n, S.settings.split, prio, wk);
        const tp0 = timePlan(mins, S.settings.goal, S.settings.exPerMuscle);
        const wSeed = weekNumberOf(wk);
        const finishers = buildFinisherSequence(n, prio, wSeed);
        const muscleOcc = {};
        return pairs.map((pair, i) => {
          const k = pair[0] + "-" + pair[1];
          let [m1, m2] = pair;
          if (
            prio &&
            prio.includes(m2) &&
            !prio.includes(m1) &&
            tp0.c1 > tp0.c2
          ) {
            [m1, m2] = [m2, m1];
          }
          const finM = finishers[i];
          const s1 = wSeed + (muscleOcc[m1] || 0);
          muscleOcc[m1] = (muscleOcc[m1] || 0) + 1;
          const s2 = wSeed + (muscleOcc[m2] || 0);
          muscleOcc[m2] = (muscleOcc[m2] || 0) + 1;
          const sFin = wSeed + (muscleOcc[finM] || 0);
          muscleOcc[finM] = (muscleOcc[finM] || 0) + 1;

          const tp = timePlan(
            mins,
            S.settings.goal,
            S.settings.exPerMuscle,
            [m1, m2],
            finM
          );
          return {
            idx: i,
            key: k,
            name: `${MFR[m1]} & ${MFR[m2]}`,
            short: `${MSHORT[m1]}/${MSHORT[m2]}`,
            seeds: [s1, s2, sFin],
            muscles: [m1, m2],
            finisher: finM,
            blocks: [
              { m: m1, count: tp.c1 },
              { m: m2, count: tp.c2 },
              { m: finM, count: 1, isFinisher: true },
            ],
            sub: `${MFR[m1]} (${tp.c1}) · ${MFR[m2]} (${tp.c2}) + ${MFR[finM]} (${tp.finSets}s)`,
            tp,
          };
        });
      }

      const ANGLE_ORDER = {
        pecs: ["flat", "incline", "lower", "fly"],
        dos: ["lat", "mid", "pullover", "low"],
        trapezes: ["sup", "midlow"],
        epaules: ["press", "lat", "rear"],
        biceps: ["sup", "stretch", "neut"],
        triceps: ["long", "push", "comp"],
        avantbras: ["flex", "ext", "grip"],
        abdos: ["upper", "lower", "core"],
        obliques: ["rot", "latflex", "antirot"],
      };

      function pickForMuscle(m, count, seed = 0) {
        const pool = EX.filter((e) => e.m === m);
        const rot = (a, s) =>
          a.length ? a.slice(s % a.length).concat(a.slice(0, s % a.length)) : a;
        const rawAngles = ANGLE_ORDER[m] || [
          ...new Set(pool.map((e) => e.angle).filter(Boolean)),
        ];
        const angles = rot(rawAngles, seed);
        const buckets = angles
          .map((ang) =>
            rot(
              pool.filter((e) => e.angle === ang),
              seed
            )
          )
          .filter((b) => b.length);

        const out = [];
        let pass = 0;
        while (out.length < count && pass < 4) {
          for (const b of buckets) {
            if (out.length >= count) break;
            if (b[pass] && !out.includes(b[pass])) out.push(b[pass]);
          }
          pass++;
        }
        if (out.length < count) {
          for (const e of rot(pool, seed)) {
            if (out.length < count && !out.includes(e)) out.push(e);
          }
        }
        return out;
      }

      function exercisesFor(muscles, tp, seeds = [0, 0, 0], finM = null) {
        const counts = [tp.c1, tp.c2];
        const items = [];
        const seen = new Set();
        muscles.forEach((m, idx) => {
          const cnt = counts[idx] || 2;
          const seed = Array.isArray(seeds) ? seeds[idx] || 0 : seeds || 0;
          let rank = 0;
          pickForMuscle(m, cnt, seed).forEach((e) => {
            let ex = e;
            const sw = S.swaps[e.id];
            if (sw && EXI[sw] && EXI[sw].m === m && !seen.has(sw)) ex = EXI[sw];
            if (seen.has(ex.id)) return;
            seen.add(ex.id);
            items.push({
              e: ex,
              orig: e.id,
              tp,
              rank: rank++,
              isFinisher: isFinisherMuscle(ex.m),
            });
          });
        });
        if (finM && PROFILE[finM]) {
          const fSeed = Array.isArray(seeds)
            ? seeds[2] ?? seeds[0] ?? 0
            : seeds || 0;
          pickForMuscle(finM, 1, fSeed).forEach((e) => {
            let ex = e;
            const sw = S.swaps[e.id];
            if (sw && EXI[sw] && EXI[sw].m === finM && !seen.has(sw))
              ex = EXI[sw];
            if (seen.has(ex.id)) return;
            seen.add(ex.id);
            items.push({ e: ex, orig: e.id, tp, rank: 0, isFinisher: true });
          });
        }
        return items;
      }

      function slotExercises(slot, customMins, finOverride = undefined) {
        const mins = customMins || slot.tp?.mins || S.settings.duration;
        const finM = finOverride !== undefined ? finOverride : slot.finisher;
        const tp = timePlan(
          mins,
          S.settings.goal,
          S.settings.exPerMuscle,
          slot.muscles,
          finM
        );
        return exercisesFor(slot.muscles, tp, slot.seeds || [0, 0, 0], finM);
      }

      function customPairExercises(m1, m2, mins, seed = 0, finM = undefined) {
        const resolvedFin =
          finM === undefined ? defaultFinisherFor([m1, m2], seed) : finM;
        const tp = timePlan(
          mins,
          S.settings.goal,
          S.settings.exPerMuscle,
          [m1, m2],
          resolvedFin
        );
        return exercisesFor([m1, m2], tp, [seed, seed, seed], resolvedFin);
      }

      /* ============ État ============ */
      const KEY = "muscu-log-upper-v2";
      function fresh() {
        return {
          v: 2,
          created: today(),
          onboarded: false,
          settings: {
            gymDays: [0, 1, 2, 4, 5],
            strictDays: true,
            duration: 60,
            exPerMuscle: "auto",
            priority: [],
            goal: "hyper",
            split: "auto",
            theme: "cyan",
          },
          blocked: {},
          pins: {},
          customPins: {},
          weekN: {},
          weekDur: {},
          weekPrio: {},
          dayDur: {},
          dayFinisher: {},
          swaps: {},
          logs: [],
          body: [],
          active: null,
          timer: null,
        };
      }
      let persistOK = true;
      function load() {
        try {
          const r = localStorage.getItem(KEY);
          if (r) {
            const o = JSON.parse(r),
              f = fresh();
            return Object.assign(f, o, {

            });
          }

        }

      }
      let S = load() || fresh();
      function applyTheme() {
        const th = S.settings?.theme || "cyan";
        if (th === "cyan")
          document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", th);
      }
      applyTheme();

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {
          persistOK = false;
        }
      }

      const ui = {
        tab: "home",
        month: today().slice(0, 7),
        progEx: null,
        metric: "w",
        free: { muscles: ["pecs", "triceps"], dur: 60, finisher: "auto" },
        modalWeek: null,
        addTarget: "active",
        addM: "pecs",
        pt: "",
      };

      /* ============ Planification hebdomadaire ============ */
      function pickDays(n, pref, strict = true) {
        pref = [...pref].sort((a, b) => a - b);
        if (!pref.length) pref = [0, 2, 4];
        if (n <= pref.length) {
          if (n === pref.length) return pref;
          if (n === 1) return [pref[Math.floor(pref.length / 2)]];
          return [
            ...new Set(
              Array.from(
                { length: n },
                (_, i) => pref[Math.round((i * (pref.length - 1)) / (n - 1))]
              )
            ),
          ];
        }
        if (strict) return pref;
        const out = [...pref];
        while (out.length < n) {
          let best = -1,
            bd = -1;
          for (let d = 0; d < 7; d++) {
            if (out.includes(d)) continue;
            const md = Math.min(...out.map((x) => Math.abs(x - d)));
            if (md > bd) {
              bd = md;
              best = d;
            }
          }
          out.push(best);
        }
        return out.sort((a, b) => a - b);
      }

      function planWeek(wk) {
        const strict = S.settings.strictDays !== false;
        const prefDays = [...S.settings.gymDays].sort((a, b) => a - b);
        const rawN = S.weekN[wk] ?? prefDays.length;
        const n = strict ? Math.min(rawN, prefDays.length) : rawN;
        const dur = S.weekDur[wk] ?? S.settings.duration;
        const prio = S.weekPrio[wk] ?? S.settings.priority;
        const slots = buildSlots(n, prio, dur, wk);
        const mon = parse(wk),
          t = today();
        const days = Array.from({ length: 7 }, (_, i) => ymd(addDays(mon, i)));
        const info = {};
        days.forEach(
          (d, i) =>
            (info[d] = {
              date: d,
              logs: [],
              slot: null,
              customPair: null,
              pinned: false,
              blocked: S.blocked[d] || null,
              defaultRest: !prefDays.includes(i),
              missed: false,
            })
        );
        S.logs.forEach((l) => {
          if (info[l.date]) info[l.date].logs.push(l);
        });
        const doneSlots = new Set(
          S.logs
            .filter(
              (l) => l.weekKey === wk && l.slot != null && l.slot < slots.length
            )
            .map((l) => l.slot)
        );
        const pinned = new Set();
        days.forEach((d) => {
          if (d < t || info[d].blocked || info[d].logs.length) return;
          if (S.customPins[d]) {
            info[d].customPair = S.customPins[d];
            info[d].pinned = true;
            return;
          }
          const p = S.pins[d];
          if (
            p == null ||
            p >= slots.length ||
            doneSlots.has(p) ||
            pinned.has(p)
          )
            return;
          info[d].slot = p;
          info[d].pinned = true;
          pinned.add(p);
        });
        const remaining = slots
          .map((s) => s.idx)
          .filter((i) => !doneSlots.has(i) && !pinned.has(i));
        const pref = new Set(pickDays(n, prefDays, strict));

        let pool = days.filter(
          (d, i) =>
            d >= t &&
            !info[d].blocked &&
            !info[d].logs.length &&
            info[d].slot == null &&
            !info[d].customPair &&
            (!strict || prefDays.includes(i))
        );

        const taken = days
          .map((d, i) =>
            info[d].logs.length || info[d].slot != null || info[d].customPair
              ? i
              : -1
          )
          .filter((i) => i >= 0);
        const chosen = pool
          .filter((d) => pref.has(days.indexOf(d)))
          .slice(0, remaining.length);
        pool = pool.filter((d) => !chosen.includes(d));
        while (chosen.length < remaining.length && pool.length) {
          const occ = [...taken, ...chosen.map((d) => days.indexOf(d))];
          let best = null,
            bs = -1;
          pool.forEach((d) => {
            const i = days.indexOf(d);
            const md = occ.length
              ? Math.min(...occ.map((o) => Math.abs(o - i)))
              : 9;
            if (md > bs) {
              bs = md;
              best = d;
            }
          });
          chosen.push(best);
          pool = pool.filter((d) => d !== best);
        }
        chosen.sort();
        remaining.forEach((si, k) => {
          if (chosen[k]) info[chosen[k]].slot = si;
        });
        const unplaced = remaining.slice(chosen.length);
        days.forEach((d, i) => {
          if (
            pref.has(i) &&
            d < t &&
            d >= S.created &&
            !info[d].blocked &&
            !info[d].logs.length
          )
            info[d].missed = true;
        });
        return {
          wk,
          n,
          dur,
          prio,
          slots,
          info,
          days,
          unplaced,
          done: doneSlots.size,
          pref,
          strict,
        };
      }

      /* ============ Prescription & progression ============ */
      function prescribe(e, tp, rank = 0) {
        const g = S.settings.goal,
          c = e.t === "c",
          isFin = isFinisherMuscle(e.m);
        const reps = repsFor(e, g);
        const sets = setsFor(e.m, rank, tp ? tp.mins : S.settings.duration);
        const rest = tp
          ? isFin
            ? tp.finRest
            : c
            ? tp.compRest
            : tp.isoRest
          : g === "force"
          ? c
            ? 150
            : 90
          : g === "endu"
          ? c
            ? 60
            : 45
          : isFin
          ? 60
          : c
          ? 105
          : 75;
        return { sets, reps, rest };
      }

      function lastPerf(id, origId = null) {
        const ls = [...S.logs].sort((a, b) =>
          a.date < b.date ? -1 : a.date > b.date ? 1 : 0
        );
        for (let i = ls.length - 1; i >= 0; i--) {
          const x = ls[i].exercises.find((x) => x.id === id);
          if (x && x.sets.length)
            return { date: ls[i].date, sets: x.sets, fromOrig: false };
        }
        if (origId && origId !== id) {
          for (let i = ls.length - 1; i >= 0; i--) {
            const x = ls[i].exercises.find(
              (x) => x.id === origId || x.orig === origId
            );
            if (x && x.sets.length) {
              return {
                date: ls[i].date,
                sets: x.sets,
                fromOrig: true,
                origName: EXI[x.id]?.n || x.name || EXI[origId]?.n || origId,
              };
            }
          }
        }
        return null;
      }

      function suggest(e, p, origId = null) {
        const lp = lastPerf(e.id, origId);
        if (!lp)
          return {
            w: e.bw ? 0 : null,
            note: e.bw
              ? `Première fois : commence au poids du corps (${p.sets} séries)`
              : `Première fois : choisis une charge maîtrisée sur ${p.sets} séries (2 reps en réserve).`,
          };
        const w = Math.max(...lp.sets.map((s) => s.w));
        const top = lp.sets.filter((s) => s.w === w);
        const bestR = Math.max(...top.map((s) => s.r));
        if (lp.fromOrig) {
          return {
            w: e.bw ? 0 : null,
            note: `Variante de ${lp.origName} (dernier : ${nf(
              w
            )} kg × ${bestR}) — choisis une charge adaptée sur ${
              p.sets
            } séries.`,
          };
        }
        const hit =
          lp.sets.length >= p.sets &&
          lp.sets.slice(0, p.sets).every((s) => s.r >= p.reps[1]);
        if (hit) {
          const nw = Math.round((w + (e.inc || 2.5)) * 4) / 4;
          return {
            w: nw,
            note:
              `${p.sets} séries à ${p.reps[1]} reps validées à ${nf(
                w
              )} kg → monte à ${nf(nw)} kg` + (e.bw ? " (lest)" : ""),
          };
        }
        return {
          w,
          note: `Garde ${nf(w)} kg${e.bw ? " (lest)" : ""} et vise ${Math.min(
            p.reps[1],
            bestR + 1
          )}+ reps sur tes ${p.sets} séries`,
        };
      }

      function buildEx(e, orig, tp, rank = 0, isFinisher = null) {
        const p = prescribe(e, tp, rank);
        const sg = suggest(e, p, orig);
        return {
          id: e.id,
          orig: orig || e.id,
          name: e.n,
          m: e.m,
          t: e.t,
          bw: !!e.bw,
          inc: e.inc || 2.5,
          rank,
          isFinisher: isFinisher != null ? !!isFinisher : isFinisherMuscle(e.m),
          reps: p.reps,
          rest: p.rest,
          suggest: sg,
          sets: Array.from({ length: p.sets }, () => ({
            w: sg.w != null ? String(sg.w) : "",
            r: "",
            done: false,
          })),
        };
      }

      function startWorkout(
        name,
        muscles,
        items,
        slot,
        date,
        wk,
        targetDur,
        finisher = null
      ) {
        const dur =
          targetDur || S.dayDur[date] || S.weekDur[wk] || S.settings.duration;
        S.active = {
          id: uid(),
          date,
          weekKey: wk,
          slot,
          name,
          muscles,
          finisher,
          targetDur: dur,
          startedAt: Date.now(),
          exercises: buildItems(items),
        };
        save();
        ui.tab = "workout";
        render();
        window.scrollTo(0, 0);
        try {
          navigator.wakeLock &&
            navigator.wakeLock.request("screen").catch(() => {});
        } catch (e) {}
      }

      function startSlot(wk, idx, dateOverride) {
        const P = planWeek(wk);
        const s = P.slots[idx];
        if (!s) return;
        const d = dateOverride || today();
        const dur = S.dayDur[d] || P.dur;
        const fm = resolveDayFinisher(d, s.finisher);
        startWorkout(
          s.name,
          s.muscles,
          slotExercises(s, dur, fm),
          idx,
          d,
          wk,
          dur,
          fm
        );
      }

      function startCustomPair(
        m1,
        m2,
        dur,
        dateOverride,
        wkOverride,
        finOverride = undefined
      ) {
        const d = dateOverride || today();
        const wk = wkOverride || wkOf(d);
        const mins = dur || S.dayDur[d] || S.weekDur[wk] || S.settings.duration;
        const fm =
          finOverride !== undefined
            ? finOverride
            : resolveDayFinisher(
                d,
                defaultFinisherFor([m1, m2], weekNumberOf(d))
              );
        const items = customPairExercises(m1, m2, mins, weekNumberOf(d), fm);
        startWorkout(
          `${MFR[m1]} & ${MFR[m2]}`,
          [m1, m2],
          items,
          null,
          d,
          wk,
          mins,
          fm
        );
      }

      function adaptActiveDuration(newMins) {
        if (!S.active) return;
        newMins = Math.max(30, Math.min(120, Number(newMins) || 60));
        const primary = (
          S.active.muscles && S.active.muscles.length
            ? S.active.muscles
            : [
                ...new Set(
                  S.active.exercises
                    .filter((x) => !isFinisherMuscle(x.m))
                    .map((x) => x.m)
                ),
              ]
        ).slice(0, 2);
        const [m1, m2] = primary;
        const activeFin =
          S.active.exercises.find((x) => isFinisherMuscle(x.m))?.m ||
          S.active.finisher ||
          null;
        const tp = timePlan(
          newMins,
          S.settings.goal,
          S.settings.exPerMuscle,
          [m1, m2],
          activeFin
        );
        const counts = { [m1]: tp.c1, [m2]: tp.c2 };
        const next = [];
        primary.forEach((m) => {
          if (!m) return;
          const targetCnt = counts[m] || 2;
          let cur = S.active.exercises.filter((x) => x.m === m);
          if (cur.length > targetCnt) {
            const started = cur.filter((x) => x.sets.some((s) => s.done));
            const unstarted = cur.filter((x) => !x.sets.some((s) => s.done));
            cur = started
              .concat(unstarted)
              .slice(0, Math.max(targetCnt, started.length));
          } else if (cur.length < targetCnt) {
            const used = new Set(S.active.exercises.map((x) => x.id));
            const extra = pickForMuscle(m, targetCnt + 2, 0)
              .filter((e) => !used.has(e.id))
              .slice(0, targetCnt - cur.length);
            extra.forEach((e) =>
              cur.push(buildEx(e, e.id, tp, cur.length, false))
            );
          }
          cur.forEach((x, rIdx) => {
            const exMeta = EXI[x.id] || { t: "c" };
            x.rest = exMeta.t === "c" ? tp.compRest : tp.isoRest;
            const targetSets = setsFor(m, rIdx, newMins);
            if (x.sets.length < targetSets) {
              const lastW = x.sets[x.sets.length - 1]?.w ?? "";
              while (x.sets.length < targetSets)
                x.sets.push({ w: lastW, r: "", done: false });
            } else if (x.sets.length > targetSets) {
              while (
                x.sets.length > targetSets &&
                !x.sets[x.sets.length - 1].done
              )
                x.sets.pop();
            }
            next.push(x);
          });
        });
        S.active.exercises
          .filter((x) => !primary.includes(x.m))
          .forEach((x) => {
            const exMeta = EXI[x.id] || { t: "i" };
            const isFin = isFinisherMuscle(x.m);
            x.rest = isFin
              ? tp.finRest
              : exMeta.t === "c"
              ? tp.compRest
              : tp.isoRest;
            const targetSets = setsFor(x.m, 0, newMins);
            if (x.sets.length < targetSets) {
              const lastW = x.sets[x.sets.length - 1]?.w ?? "";
              while (x.sets.length < targetSets)
                x.sets.push({ w: lastW, r: "", done: false });
            } else if (x.sets.length > targetSets) {
              while (
                x.sets.length > targetSets &&
                !x.sets[x.sets.length - 1].done
              )
                x.sets.pop();
            }
            next.push(x);
          });
        S.active.exercises = next;
        S.active.targetDur = newMins;
        save();
        toast(
          `Séance adaptée pour ${newMins} min (${
            next.length
          } exos · ${totalSetsOf(next)} séries)`
        );
        render();
      }

      /* ============ Minuteur ============ */
      let actx = null;
      function audio() {
        try {
          if (!actx)
            actx = new (window.AudioContext || window.webkitAudioContext)();
          if (actx.state === "suspended") actx.resume();
        } catch (e) {}
      }
      function beep() {
        try {
          audio();
          if (!actx) return;
          [0, 0.25, 0.5].forEach((t, i) => {
            const o = actx.createOscillator(),
              g = actx.createGain();
            o.frequency.value = i === 2 ? 1175 : 880;
            o.connect(g);
            g.connect(actx.destination);
            const st = actx.currentTime + t;
            g.gain.setValueAtTime(0.0001, st);
            g.gain.exponentialRampToValueAtTime(0.4, st + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, st + 0.2);
            o.start(st);
            o.stop(st + 0.22);
          });
          navigator.vibrate && navigator.vibrate([200, 100, 200]);
        } catch (e) {}
      }
      function startTimer(sec, label) {
        audio();
        S.timer = {
          end: Date.now() + sec * 1000,
          total: sec,
          label,
          fired: false,
        };
        save();
        tick();
      }
      function tick() {
        const el = $("#timer");
        if (S.timer) {
          const left = (S.timer.end - Date.now()) / 1000;
          el.hidden = false;
          if (left <= 0) {
            if (!S.timer.fired) {
              S.timer.fired = true;
              save();
              beep();
            }
            el.classList.add("fin");
            $("#tt").textContent = "GO !";
            $("#tl").textContent = "Repos terminé — série suivante";
            $("#tstop").textContent = "OK";
          } else {
            el.classList.remove("fin");
            $("#tt").textContent = mmss(left);
            $("#tl").textContent = S.timer.label;
            $("#tstop").textContent = "Passer";
            $("#tbar").style.width =
              Math.min(100, (1 - left / S.timer.total) * 100) + "%";
          }
        } else el.hidden = true;
        const e = $("#elapsed");
        if (e && S.active)
          e.textContent = mmss((Date.now() - S.active.startedAt) / 1000);
      }
      setInterval(tick, 250);

      /* ============ UI helpers ============ */
      let toastT = null;
      function toast(m) {
        let t = $(".toast");
        if (t) t.remove();
        t = document.createElement("div");
        t.className = "toast";
        t.setAttribute("role", "status");
        t.textContent = m;
        document.body.appendChild(t);
        clearTimeout(toastT);
        toastT = setTimeout(() => t.remove(), 3600);
      }
      function modal(html) {
        $("#sheet").innerHTML = html;
        $("#modal").hidden = false;
      }
      function closeModal() {
        $("#modal").hidden = true;
        $("#sheet").innerHTML = "";
        ui.modalWeek = null;
      }
      function demoModal(html) {
        $("#demo-sheet").innerHTML = html;
        $("#demo-modal").hidden = false;
      }
      function closeDemoModal() {
        stopDemoAnim();
        $("#demo-modal").hidden = true;
        $("#demo-sheet").innerHTML = "";
      }
      function confirmM(msg, act, data = {}) {
        const attrs = Object.entries(data)
          .map(([k, v]) => `data-${k}="${esc(v)}"`)
          .join(" ");
        modal(
          `<h3>Confirmer</h3><p>${msg}</p><div class="row" style="margin-top:14px"><button class="btn grow" data-act="close">Annuler</button><button class="btn primary grow" data-act="${act}" ${attrs}>Confirmer</button></div>`
        );
      }
      const chip = (on, act, data, label, cls = "") =>
        `<button class="chip ${cls} ${
          on ? "on" : ""
        }" data-act="${act}" ${Object.entries(data || {})
          .map(([k, v]) => `data-${k}="${esc(v)}"`)
          .join(" ")} aria-pressed="${!!on}">${label}</button>`;

      /* Volume hebdomadaire par muscle */
      function weekMuscleVolume(wk, P) {
        const volMap = Object.fromEntries(
          MUSCLES.map((m) => [m, { done: 0, planned: 0 }])
        );
        S.logs
          .filter((l) => l.weekKey === wk)
          .forEach((l) => {
            l.exercises.forEach((x) => {
              if (volMap[x.m]) volMap[x.m].done += x.sets ? x.sets.length : 0;
            });
          });
        P.days.forEach((d) => {
          const inf = P.info[d];
          if (inf.logs.length || inf.blocked) return;
          const dd = S.dayDur[d] || P.dur;
          let items = [];
          if (inf.customPair) {
            const fm = resolveDayFinisher(
              d,
              defaultFinisherFor(inf.customPair, weekNumberOf(d))
            );
            items = customPairExercises(
              inf.customPair[0],
              inf.customPair[1],
              dd,
              weekNumberOf(d),
              fm
            );
          } else if (inf.slot != null && P.slots[inf.slot]) {
            const s = P.slots[inf.slot];
            const fm = resolveDayFinisher(d, s.finisher);
            items = slotExercises(s, dd, fm);
          }
          items.forEach((it) => {
            if (volMap[it.e.m])
              volMap[it.e.m].planned += setsFor(it.e.m, it.rank, dd);
          });
        });
        return volMap;
      }

      function profileTable() {
        const g = S.settings.goal;
        return `<table style="margin-bottom:12px">
          <tr><th>Muscle (rôle)</th><th>Exos / séance</th><th>Séries / exo</th><th>Cible / sem.</th></tr>
          ${MUSCLES.map((m) => {
            const p = PROFILE[m];
            return `<tr>
              <td><b>${esc(MFR[m])}</b> <span class="tiny mut">(${esc(
              p.label
            )})</span></td>
              <td>${esc(p.exRange)}</td>
              <td>${esc(p.setsLabel || "3–4 séries")}</td>
              <td><b>${p.weeklyTarget[0]}–${p.weeklyTarget[1]}</b> séries</td>
            </tr>`;
          }).join("")}
        </table>
        <table>
          <tr><th>Type de mouvement</th><th>Hypertrophie</th><th>Force</th><th>Endurance</th></tr>
          ${["free", "guided", "iso"]
            .map((k) => {
              const mv = MOV_REPS[k];
              return `<tr>
              <td><b>${esc(mv.label)}</b></td>
              <td>${
                g === "hyper"
                  ? `<b>${repsTxt(mv.hyper)}</b>`
                  : repsTxt(mv.hyper)
              }</td>
              <td>${
                g === "force"
                  ? `<b>${repsTxt(mv.force)}</b>`
                  : repsTxt(mv.force)
              }</td>
              <td>${
                g === "endu" ? `<b>${repsTxt(mv.endu)}</b>` : repsTxt(mv.endu)
              }</td>
            </tr>`;
            })
            .join("")}
        </table>`;
      }

      /* ============ Stats ============ */
      function vol(l) {
        return l.exercises.reduce(
          (a, x) => a + x.sets.reduce((b, s) => b + s.w * s.r, 0),
          0
        );
      }
      function stats() {
        const t = today(),
          m = t.slice(0, 7),
          wk = wkOf(t);
        const month = S.logs.filter((l) => l.date.startsWith(m)).length;
        const wvol = S.logs
          .filter((l) => l.weekKey === wk)
          .reduce((a, l) => a + vol(l), 0);
        const weeks = new Set(S.logs.map((l) => l.weekKey));
        let streak = 0,
          c = monday(new Date());
        if (!weeks.has(ymd(c))) c = addDays(c, -7);
        while (weeks.has(ymd(c))) {
          streak++;
          c = addDays(c, -7);
        }
        return { month, wvol, streak, total: S.logs.length };
      }

      /* ============ Onboarding ============ */
      function renderOnboarding() {

        const pr = S.settings.priority;
        const g = S.settings.goal;

        const tpx = timePlan(dur, g, "auto", ["pecs", "triceps"], "abdos");
        return `<div class="wrap">

      <span class="tag acc">Haut du corps · 2 muscles + finition</span>
      <h1 style="margin-top:8px">Configuration rapide</h1>
      <p class="mut">Chaque séance travaille <b>2 muscles principaux</b> (Pecs, Dos complet, Épaules, Trapèzes, Biceps, Triceps) + <b>1 exercice de finition (3–4 séries)</b> en addition à la fin de l'entraînement (<b>Abdos, Avant-bras ou Obliques</b> en rotation).</p>
    </div>

    <div class="card">

        chip(gd.includes(i), "obDay", { d: i }, d, "sq")

          tpx.c1
        } exos</b> (gros muscle) + <b>${
          tpx.c2
        } exos</b> (petit muscle) + <b>1 exo × ${

    <button class="btn primary block" data-act="finishOb">Valider et accéder au programme</button>
  </div>`;
      }

      /* ============ Vues ============ */
      function weekChips(wk, P) {

          chip(P.prio.includes(m), "wPrio", { wk, m }, MFR[m])
        ).join("")}</div>`;
      }

      function durationSelector(dur, act, extraData = {}) {
        return `<div class="chips">${DURATIONS.map((m) =>
          chip(dur === m, act, Object.assign({}, extraData, { m }), m + "m")
        ).join("")}</div>`;
      }

      function finisherSelector(curFin, act, extraData = {}) {
        const opts = [
          { k: "abdos", label: "Abdos" },
          { k: "avantbras", label: "Avant-bras" },
          { k: "obliques", label: "Obliques" },

      function todayCard(P) {
        const t = today(),
          inf = P.info[t];
        if (S.active) {
          const est = estimateMinutes(S.active.exercises);
          return `<div class="card hl">

      </div>
      <div class="gap"></div>
      <button class="btn primary block" data-act="tab" data-t="workout">Reprendre la séance</button>
    </div>`;
        }

      <p class="mut small">${l.exercises.length} exercices · ${totalSetsOf(

      <div class="row" style="margin-top:10px">
        <button class="btn sm" data-act="dayModal" data-d="${t}">Voir le détail</button>
        <button class="btn sm ghost" data-act="tab" data-t="workout">Nouvelle séance libre</button>

    </div>`;
        }

      function renderChart(pts, metric) {
        const W = 640,
          H = 200,
          P = 34;
        const vals = pts.map((p) => p[metric]);
        let min = Math.min(...vals),
          max = Math.max(...vals);
        if (min === max) {
          min = Math.max(0, min - 5);
          max += 5;
        }
        const padY = (max - min) * 0.12;
        min = Math.max(0, min - padY);
        max += padY;
        const xAt = (i) =>
          pts.length === 1 ? W / 2 : P + (i * (W - 2 * P)) / (pts.length - 1);
        const yAt = (v) => H - P - ((v - min) / (max - min)) * (H - 2 * P);
        const poly = pts.map((p, i) => `${xAt(i)},${yAt(p[metric])}`).join(" ");
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique de progression">
    <line x1="${P}" y1="${P}" x2="${
          W - P
        }" y2="${P}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${P}" y1="${H / 2}" x2="${W - P}" y2="${
          H / 2
        }" stroke="var(--line)" stroke-dasharray="3 3"/>
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${
          H - P
        }" stroke="var(--line)"/>
    <text x="4" y="${P + 4}">${nf(max)}</text>
    <text x="4" y="${H / 2 + 4}">${nf((max + min) / 2)}</text>
    <text x="4" y="${H - P + 4}">${nf(min)}</text>
    ${
      pts.length > 1
        ? `<polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>`
        : ""
    }
    ${pts
      .map(
        (p, i) => `
      <circle cx="${xAt(i)}" cy="${yAt(p[metric])}" r="5" fill="var(--acc)"/>
      <text x="${xAt(i)}" y="${H - 10}" text-anchor="middle">${fmtShort(
          p.date
        )}</text>
    `
      )
      .join("")}
  </svg>`;
      }
